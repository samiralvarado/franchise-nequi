version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: franchise-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - franchise-network

  api:
    build: .
    container_name: franchise-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/franchise_db
    depends_on:
      - mongodb
    networks:
      - franchise-network

networks:
  franchise-network:
    driver: bridge

volumes:
  mongo-data:
